services:
  - type: web
    name: hubspot-shopify-sync
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # PORT is injected by Render itself — do not set it here.
      - key: APP_URL
        sync: false # set once you know the assigned onrender.com URL (or custom domain)
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET_KEY
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
